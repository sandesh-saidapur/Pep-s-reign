[project]
name = "pep-reign"
version = "0.1.0"
description = "How good was Manchester City under Pep Guardiola? An analytics and ML portfolio project on free football data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pandera>=0.20",
    "httpx>=0.27",
    "typer>=0.12",
    "duckdb>=1.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
]
app = [
    "streamlit>=1.37",
]

[project.scripts]
pep-reign = "pep_reign.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pep_reign"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
